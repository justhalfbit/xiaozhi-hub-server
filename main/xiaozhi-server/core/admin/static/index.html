<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小智 Hub 管理后台</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url(%23g)'/%3E%3Crect x='11' y='19' width='42' height='31' rx='10' fill='%23fff'/%3E%3Ccircle cx='24' cy='32' r='5' fill='%234f46e5'/%3E%3Ccircle cx='40' cy='32' r='5' fill='%234f46e5'/%3E%3Cpath d='M27 42h10' stroke='%230891b2' stroke-width='3.5' stroke-linecap='round'/%3E%3Cpath d='M32 19v-7' stroke='%23fff' stroke-width='3.5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='10' r='4' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root {
    --side: #0f172a; --side-text: #94a3b8; --side-hover: #1e293b; --side-line: #1e293b;
    --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --muted: #64748b; --line: #e2e8f0; --field: #ffffff; --soft: #f8fafc;
    --accent: #4f46e5; --btn: #4f46e5; --btn-hover: #4338ca; --accent-soft: #eef2ff; --accent-line: #c7d2fe;
    --ok: #059669; --ok-soft: #ecfdf5; --warn: #b45309; --warn-soft: #fffbeb; --err: #dc2626; --err-soft: #fef2f2;
    --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 1px 3px rgba(15, 23, 42, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --side: #0b1120; --side-hover: #172033; --side-line: #172033;
      --bg: #0f172a; --card: #111a2e; --text: #e2e8f0; --muted: #94a3b8; --line: #23304a; --field: #0b1324; --soft: #0d1629;
      --accent: #818cf8; --btn: #6366f1; --btn-hover: #4f46e5; --accent-soft: #1e2547; --accent-line: #3b437a;
      --ok: #34d399; --ok-soft: #0f2a24; --warn: #fbbf24; --warn-soft: #2a2110; --err: #f87171; --err-soft: #2c1517;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
         color: var(--text); background: var(--bg); }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .hidden { display: none !important; }

  /* ---------- 布局 ---------- */
  .app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
  aside { background: var(--side); color: var(--side-text); padding: 20px 14px; position: sticky; top: 0; height: 100vh;
          display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 600; font-size: 15px; padding: 0 8px 22px; }
  .logo { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #6366f1, #22d3ee);
          display: grid; place-items: center; font-size: 16px; flex: none; }
  .nav button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; border: 0;
                background: none; color: inherit; cursor: pointer; text-align: left; margin-bottom: 2px; }
  .nav button:hover { background: var(--side-hover); color: #e2e8f0; }
  .nav button.active { background: var(--side-hover); color: #fff; box-shadow: inset 3px 0 0 #818cf8; }
  .nav .ico { width: 18px; text-align: center; }
  .side-foot { margin-top: auto; font-size: 12px; padding: 12px 10px 0; border-top: 1px solid var(--side-line); }
  .side-foot button { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; cursor: pointer; }
  .side-foot .row { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
  .side-foot a { color: inherit; text-decoration: none; }
  .side-foot a:hover { color: #e2e8f0; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #64748b; margin-right: 6px; vertical-align: 1px; }
  .dot.on { background: #34d399; box-shadow: 0 0 0 3px rgba(52, 211, 153, .2); }
  .dot.off { background: #f87171; }
  #online-short { display: none; }
  main { padding: 28px 36px 72px; max-width: 1080px; width: 100%; }

  /* ---------- 通用元素 ---------- */
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); margin: 4px 0 0; }
  .pill { display: inline-block; font-size: 12px; padding: 1px 10px; border-radius: 999px; font-weight: 500; white-space: nowrap;
          background: var(--soft); color: var(--muted); border: 1px solid var(--line); }
  .pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .pill.err { background: var(--err-soft); color: var(--err); border-color: transparent; }
  .section-title { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .03em; margin: 28px 0 10px;
                   display: flex; align-items: center; gap: 8px; }
  .section-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
  .card + .card { margin-top: 12px; }
  .panel { padding: 20px 22px; }
  .choices + .card, .vendors + .card { margin-top: 12px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 22px;
               border-bottom: 1px solid var(--line); }
  .card-head h2 { font-size: 15px; margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .banner { padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; font-size: 13px; }
  .banner.warn { background: var(--warn-soft); color: var(--warn); }
  .banner.err { background: var(--err-soft); color: var(--err); }
  .banner.info { background: var(--accent-soft); color: var(--accent); }

  /* 表单 */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 20px; }
  .full { grid-column: 1 / -1; }
  label.f { display: block; font-size: 13px; font-weight: 500; }
  label.f .hint { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
  .in { width: 100%; margin-top: 6px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); }
  .in:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .seg { display: inline-flex; margin-top: 6px; background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
  .seg button { padding: 5px 18px; border-radius: 6px; color: var(--muted); cursor: pointer; border: 0; background: none; }
  .seg button:hover:not(.on) { color: var(--text); }
  .seg button.on { background: var(--btn); color: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; background: var(--card); }
  .chip.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
  .chip.risky { border-style: dashed; }
  .chip-x { border: 0; background: none; color: inherit; cursor: pointer; padding: 0 0 0 4px; font-size: 14px; line-height: 1; }
  .chip.risky.on { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
  .cli-row { display: grid; grid-template-columns: 6em minmax(0, 1fr); gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
  .cli-row:first-child { border-top: 0; padding-top: 0; }
  .cli-k { font-weight: 500; padding-top: 9px; }
  .cli-row .seg { margin-top: 0; flex-wrap: wrap; }
  .cli-row .seg button { padding: 6px 14px; line-height: 1.3; }
  .cli-row .seg button small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
  .cli-row .seg button.on small { color: rgba(255, 255, 255, .85); }
  #model-custom { margin-top: 8px; }
  .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .level { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; text-align: left; background: var(--card); cursor: pointer; }
  .level b { display: block; font-size: 14px; }
  .level small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .level.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .level.auto.on { border-color: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
  .switch { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; cursor: pointer; }
  .switch input { width: 16px; height: 16px; accent-color: var(--accent); }
  .switch small { color: var(--muted); font-size: 12px; }
  details.adv { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
  details.adv summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  details.adv[open] summary { margin-bottom: 14px; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; align-items: center; margin-top: 20px; flex-wrap: wrap; }
  .actions .result { margin-right: auto; font-size: 13px; }
  .btn { position: relative; padding: 8px 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--accent-line); }
  .btn.primary { background: var(--btn); border-color: var(--btn); color: #fff; }
  .btn.primary:hover { background: var(--btn-hover); }
  .btn.sm { padding: 4px 12px; font-size: 13px; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.busy { color: transparent !important; opacity: 1; }
  .btn.busy::after { content: ""; position: absolute; inset: 0; margin: auto; width: 14px; height: 14px; border-radius: 50%;
                     border: 2px solid var(--muted); border-right-color: transparent; animation: spin .8s linear infinite; }
  .btn.primary.busy::after { border-color: #fff; border-right-color: transparent; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 选择卡片 */
  .choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .choices.three { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }  /* 放得下才三列，否则两列 */
  .choice { padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); display: flex; gap: 14px;
            text-align: left; box-shadow: var(--shadow); }
  button.choice { cursor: pointer; }
  .choice.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .choice.off { opacity: .55; cursor: not-allowed; }
  .choice .mark { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; flex: none; font-size: 17px; }
  .choice b { font-size: 15px; } .choice small { display: block; color: var(--muted); word-break: break-all; }
  .vendors { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
  .vendor { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--card); cursor: pointer;
            position: relative; text-align: left; box-shadow: var(--shadow); }
  .vendor.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .vendor b { display: block; font-size: 14px; }
  .vendor small { color: var(--muted); font-size: 12px; }
  .vendor i { position: absolute; top: 12px; right: 12px; width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .vendor i.set { background: var(--ok); }
  .vendor.using { border-color: var(--ok); background: var(--ok-soft); }
  .vendor.using.on { box-shadow: 0 0 0 3px var(--accent-soft), inset 0 0 0 1px var(--ok); border-color: var(--accent); }
  .vendor.using small { display: inline-block; margin-top: 2px; padding: 0 8px; border-radius: 999px; background: var(--ok); color: var(--card); font-weight: 600; }
  .vendor.using i { width: 8px; height: 8px; box-shadow: 0 0 0 3px rgba(5, 150, 105, .18); }

  /* 状态页 */
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tile { padding: 14px 16px; text-align: left; cursor: pointer; }
  .tile:hover { border-color: var(--accent-line); }
  .tile .k { color: var(--muted); font-size: 12px; }
  .tile .v { font-weight: 600; font-size: 15px; margin-top: 2px; word-break: break-all; }
  .tile .d { color: var(--muted); font-size: 12px; }
  .kv { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; gap: 8px 14px; align-items: center; }
  .kv .k { color: var(--muted); }
  .kv code { word-break: break-all; }
  .rows > div { display: flex; gap: 12px; align-items: center; padding: 10px 22px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .rows > div:first-child { border-top: 0; }
  .rows b { min-width: 7.5em; font-weight: 500; }
  .device { padding: 14px 22px; border-top: 1px solid var(--line); }
  .device:first-child { border-top: 0; }
  .device-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .emogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; margin-top: 12px; }
  .emo { border: 1px solid var(--line); border-radius: 10px; background: var(--soft); padding: 8px 4px; cursor: pointer; text-align: center; }
  .emo:hover { border-color: var(--accent-line); }
  .emo.now { border-color: var(--accent); background: var(--accent-soft); }
  .emo span { display: block; font-size: 22px; line-height: 1.2; }
  .emo small { color: var(--muted); font-size: 11px; }

  /* 音色 */
  .voice-group + .voice-group { margin-top: 18px; }
  .voice-group h3 { font-size: 13px; color: var(--muted); margin: 0 0 8px; font-weight: 500; }
  .voices { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .voice { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
           background: var(--card); cursor: pointer; }
  .voice.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .voice .meta { flex: 1; min-width: 0; }
  .voice b { font-size: 14px; } .voice small { display: block; color: var(--muted); font-size: 12px; }
  .play { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--soft); cursor: pointer; flex: none; font-size: 12px; }
  .play:hover { border-color: var(--accent); color: var(--accent); }
  .play.playing { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* 插件 */
  .plugins { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .plugin { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  .plugin.on { border-color: var(--accent-line); background: var(--accent-soft); }
  .plugin.fixed { cursor: default; background: var(--soft); }
  .plugin input { margin-top: 4px; accent-color: var(--accent); }
  .plugin small { display: block; color: var(--muted); font-size: 12px; }
  .disabled-area { opacity: .45; pointer-events: none; }


  /* 工作原理 */
  .flow { display: flex; align-items: stretch; gap: 6px; overflow-x: auto; padding: 4px 2px 10px; }
  .stage { flex: 1 1 0; min-width: 118px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); padding: 12px;
           text-align: left; cursor: pointer; box-shadow: var(--shadow); }
  .stage:hover { border-color: var(--accent-line); }
  .stage.static { cursor: default; }
  .stage.static:hover { border-color: var(--line); }
  .stage .ico { font-size: 20px; line-height: 28px; height: 28px; }
  .stage b { display: block; font-size: 14px; }
  .stage .mod { display: block; font-size: 12px; color: var(--accent); font-weight: 600; margin-top: 2px; }
  .stage small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .arrow { align-self: center; color: var(--muted); flex: none; }
  .tips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .tip { padding: 14px 16px; }
  .tips .card + .card { margin-top: 0; }
  .tip b { display: block; font-size: 14px; margin-bottom: 6px; }
  .tip .say { font-size: 13px; }
  .tip .say::before { content: "你："; color: var(--muted); }
  .tip .res { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .tip .res::before { content: "→ "; color: var(--accent); }
  details.prompt-all > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 14px 22px; }
  details.prompt-all > summary::-webkit-details-marker { display: none; }
  details.prompt-all > summary .toggle { margin-left: auto; color: var(--muted); font-size: 12px; }
  details.prompt-all > .banner { margin: 12px 0 0; }
  .how-foot { margin-top: 28px; color: var(--muted); font-size: 13px; }
  .seg-card + .seg-card { margin-top: 12px; }
  .seg-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 14px 22px; }
  .seg-head .no { width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
                  display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
  .seg-head b { font-size: 15px; margin-right: 4px; }
  .seg-note { padding: 0 22px 12px; color: var(--muted); font-size: 13px; margin: 0; }
  .prompt-text { margin: 0; padding: 14px 22px 18px; border-top: 1px solid var(--line); white-space: pre-wrap; word-break: break-word;
                 font: 12.5px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; max-height: 520px; overflow: auto; background: var(--soft);
                 border-radius: 0 0 12px 12px; }
  .prompt-text mark { background: var(--warn-soft); color: inherit; border-radius: 4px; padding: 0 2px; box-shadow: inset 0 0 0 1px rgba(180, 83, 9, .25); }
  .prompt-text mark.persona { display: block; background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); padding: 6px 10px; margin: 2px 0; }
  .prompt-text mark i { font-style: normal; font-size: 10.5px; color: var(--warn); margin-right: 4px; font-family: -apple-system, "PingFang SC", sans-serif; }
  .prompt-text mark.persona i { color: var(--accent); }
  details.pseg > summary { list-style: none; cursor: pointer; }
  details.pseg > summary::-webkit-details-marker { display: none; }
  details.pseg > summary .toggle { margin-left: auto; color: var(--muted); font-size: 12px; }

  /* 登录 */
  .auth { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .auth .card { width: 100%; max-width: 380px; padding: 28px; }
  .auth .brand { color: var(--text); padding: 0 0 18px; }
  .auth h2 { margin: 0 0 4px; font-size: 18px; }

  /* 更新网关 */
  .kv.two { grid-template-columns: max-content minmax(0, 1fr); }
  .commits { margin: 0; padding: 0; list-style: none; }
  .commits li { display: flex; gap: 12px; padding: 9px 22px; border-top: 1px solid var(--line); align-items: baseline; }
  .commits li:first-child { border-top: 0; }
  .commits li span { flex: 1; min-width: 0; word-break: break-word; }
  .commits li small { color: var(--muted); white-space: nowrap; }
  .update-log { margin: 10px 0 0; padding: 12px 14px; background: var(--soft); border-radius: 8px; max-height: 320px; overflow: auto;
                white-space: pre-wrap; word-break: break-word; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(8px); padding: 10px 18px; max-width: 90vw;
           border-radius: 10px; background: #0f172a; color: #fff; opacity: 0; transition: opacity .2s, transform .2s;
           pointer-events: none; z-index: 20; box-shadow: 0 8px 24px rgba(0, 0, 0, .2); }
  #toast.show { opacity: 1; transform: translateX(-50%); }
  #toast.err { background: #dc2626; }

  @media (max-width: 900px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    aside { z-index: 10; height: auto; padding: 10px 12px; flex-direction: row; align-items: center; gap: 8px; }
    .brand { padding: 0 6px 0 0; } .brand span { display: none; }
    .nav { display: flex; gap: 2px; overflow-x: auto; flex: 1; min-width: 0; }
    .nav button { width: auto; white-space: nowrap; margin: 0; padding: 7px 10px; }
    .nav button.active { box-shadow: inset 0 -2px 0 #818cf8; }
    .nav .ico { display: none; }
    .side-foot { display: flex; align-items: center; gap: 8px; margin: 0; padding: 0; border: 0; white-space: nowrap; flex: none; }
    .side-foot .row { margin: 0; }
    .side-foot #logout, #online-text { display: none; }
    #online-short { display: inline; }
    .side-foot .dot { margin-right: 4px; }
    main { padding: 20px 16px 56px; }
    .choices, .choices.three, .grid2, .grid3, .plugins, .tips, .levels { grid-template-columns: 1fr; }
    .cli-row { grid-template-columns: 1fr; gap: 6px; } .cli-k { padding-top: 0; }
    .flow { flex-direction: column; overflow: visible; }
    .arrow { transform: rotate(90deg); }
    .tiles { grid-template-columns: 1fr 1fr; }
    .kv { grid-template-columns: max-content minmax(0, 1fr); }
    .kv .copy { display: none; }
  }
</style>
</head>
<body>

<div id="auth" class="auth hidden">
  <form class="card" id="auth-form">
    <div class="brand"><div class="logo">🤖</div>小智 Hub 管理后台</div>
    <input type="text" name="username" value="admin" autocomplete="username" class="hidden" tabindex="-1">
    <div id="auth-setup" class="hidden">
      <h2>设置管理后台密码</h2>
      <p class="muted small">首次使用请设置访问密码（至少 6 位）。设置后，用这个密码登录。</p>
      <label class="f">密码<input class="in" id="setup-pw" type="password" autocomplete="new-password"></label>
      <label class="f" style="margin-top:12px">再次输入<input class="in" id="setup-pw2" type="password" autocomplete="new-password"></label>
    </div>
    <div id="auth-login" class="hidden">
      <h2>登录</h2>
      <p class="muted small">输入管理后台密码。</p>
      <label class="f">密码<input class="in" id="login-pw" type="password" autocomplete="current-password"></label>
    </div>
    <div id="auth-error" class="banner err hidden" style="margin:14px 0 0"></div>
    <button class="btn primary" id="auth-btn" type="submit" style="width:100%;margin-top:18px">登录</button>
  </form>
</div>

<div id="app" class="app hidden">
  <aside>
    <div class="brand"><div class="logo">🤖</div><span>小智 Hub</span></div>
    <nav class="nav" id="nav">
      <button data-page="status"><span class="ico">◎</span>状态</button>
      <button data-page="how"><span class="ico">⇄</span>工作原理</button>
      <button data-page="llm"><span class="ico">✦</span>大模型</button>
      <button data-page="calls"><span class="ico">☎</span>呼名</button>
      <button data-page="grokbot"><span class="ico">☁</span>Grok Bot</button>
      <button data-page="memory"><span class="ico">✎</span>记忆</button>
      <button data-page="asr"><span class="ico">◐</span>语音识别</button>
      <button data-page="tts"><span class="ico">♪</span>语音合成</button>
      <button data-page="intent"><span class="ico">⚙</span>意图识别</button>
      <button data-page="update"><span class="ico">⟳</span>更新网关</button>
    </nav>
    <div class="side-foot"><span class="dot" id="online-dot"></span><span id="online-text">没有设备在线</span><span id="online-short">无设备</span>
      <div class="row"><button id="logout">退出登录</button>
        <a href="https://github.com/justhalfbit/xiaozhi-hub-server" target="_blank" rel="noopener" title="xiaozhi-hub-server 开源仓库">GitHub ↗</a></div></div>
  </aside>
  <main id="page"></main>
</div>
<div id="toast"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function toast(msg, isError, ms) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "show" + (isError ? " err" : "");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => (t.className = isError ? "err" : ""), ms || (isError ? 6000 : 3000));
}

// quiet：后台定时查询用。登录过期时如果页面上有没保存的修改，不跳到登录页（会清掉这些修改），只抛出错误
async function api(path, body, quiet) {
  const opts = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  let res;
  try { res = await fetch("/admin/api/" + path, opts); } catch (e) { throw new Error("连不上服务，请确认服务还在运行"); }
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401 && path !== "login") {
    if (quiet && page.dirty && page.dirty()) { const e = new Error(EXPIRED); e.expired = true; throw e; }
    page.dirty = null; await route(); throw new Error(EXPIRED + "，请重新登录");
  }
  if (!res.ok || data.ok === false) throw new Error(data.error || ("请求失败：" + res.status));
  return data;
}

// 按钮执行期间显示转圈并禁用，避免重复点击；保存超过半秒（写配置、重建模型要几秒）再提示一句
async function busy(btn, fn) {
  if (btn.disabled) return;
  btn.disabled = true; btn.classList.add("busy");
  const hint = btn.textContent.includes("保存") ? "正在保存，请稍等…" : "";
  const timer = hint && setTimeout(() => toast(hint, false, 60000), 500);
  try { return await fn(); } finally {
    clearTimeout(timer);
    if (hint && $("toast").textContent === hint) $("toast").className = "";   // 结果没另行提示时收起
    btn.disabled = false; btn.classList.remove("busy");
  }
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {  // 局域网 http 页面没有剪贴板权限，退回旧办法
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
  toast("已复制");
}

// 记录表单初始值，用来判断"有没有改过"
function snapshot(fn) { const first = JSON.stringify(fn()); return () => JSON.stringify(fn()) !== first; }

// ---------- 登录与页面切换 ----------

let authMode = "login";
async function route() {
  let st;
  try { st = await (await fetch("/admin/api/state")).json(); } catch (e) { return; }
  if (st.needs_setup || !st.logged_in) {
    authMode = st.needs_setup ? "setup" : "login";
    clearInterval(page.timer); page.name = "";
    clearInterval(onlineTimer); onlineTimer = null;
    $("app").classList.add("hidden"); $("auth").classList.remove("hidden");
    $("auth-setup").classList.toggle("hidden", authMode !== "setup");
    $("auth-login").classList.toggle("hidden", authMode !== "login");
    $("auth-btn").textContent = authMode === "setup" ? "设置并进入" : "登录";
    $("auth-error").classList.add("hidden");
    $(authMode === "setup" ? "setup-pw" : "login-pw").focus();
    return;
  }
  $("auth").classList.add("hidden"); $("app").classList.remove("hidden");
  expiredWarned = false;
  watchOnline();
  await openPage(currentPage(), true);
}

$("auth-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const fail = (msg) => { $("auth-error").textContent = msg; $("auth-error").classList.remove("hidden"); };
  await busy($("auth-btn"), async () => {
    try {
      if (authMode === "setup") {
        if ($("setup-pw").value.length < 6) return fail("密码至少 6 位");
        if ($("setup-pw").value !== $("setup-pw2").value) return fail("两次输入的密码不一致");
        await api("setup", { password: $("setup-pw").value });
      } else {
        await api("login", { password: $("login-pw").value });
        $("login-pw").value = "";
      }
      await route();
    } catch (e) { fail(e.message); }
  });
});
$("logout").onclick = async () => { if (!confirmLeave()) return; page.dirty = null; await api("logout", {}); await route(); };

const PAGES = { status: renderStatus, how: renderHow, llm: renderLLM, calls: renderCallNames, grokbot: renderGrokBot, memory: renderMemory, asr: renderASR, tts: renderTTS, intent: renderIntent, update: renderUpdate };
const page = { name: "", dirty: null, timer: null };
function currentPage() { const p = location.hash.slice(1); return PAGES[p] ? p : "status"; }
function confirmLeave() { return !(page.dirty && page.dirty()) || confirm("当前页面有修改还没保存，确定离开吗？"); }

async function openPage(name, force) {
  if (!force && name === page.name) return;
  if (!force && !confirmLeave()) { history.replaceState(null, "", "#" + page.name); return; }
  clearInterval(page.timer); page.timer = null; page.dirty = null; page.name = name;
  if (audio) { audio.pause(); audio = null; }
  if (location.hash.slice(1) !== name) history.replaceState(null, "", "#" + name);
  document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("active", b.dataset.page === name));
  const root = $("page");
  if (!force) root.innerHTML = '<p class="muted">加载中…</p>';
  try { await PAGES[name](root); }
  catch (e) { root.innerHTML = `<div class="banner err">加载失败：${esc(e.message)}</div>`; }
  if (!force) window.scrollTo(0, 0);
}
document.querySelectorAll("#nav button").forEach((b) => (b.onclick = () => openPage(b.dataset.page)));
window.addEventListener("hashchange", () => openPage(currentPage()));
window.addEventListener("beforeunload", (e) => { if (page.dirty && page.dirty()) { e.preventDefault(); e.returnValue = ""; } });

// devices 为 null 表示查不到（连不上服务、登录过期）：不能停在上一次的结果上，否则服务停了还显示"1 台设备在线"
function setOnline(devices, reason = OFFLINE) {
  $("online-dot").classList.toggle("on", !!devices && devices.length > 0);
  $("online-dot").classList.toggle("off", !devices);
  $("online-text").textContent = !devices ? reason : devices.length ? `${devices.length} 台设备在线` : "没有设备在线";
  $("online-short").textContent = !devices ? (reason === OFFLINE ? "已断开" : "需登录") : devices.length ? `${devices.length} 台` : "无设备";  // 窄屏用
  $("online-dot").parentElement.title = $("online-text").textContent;
}
const OFFLINE = "连不上服务";  // api() 连不上服务时抛出的错误以这几个字开头
const EXPIRED = "登录已过期";
const isOffline = (e) => String(e && e.message).startsWith(OFFLINE);
let expiredWarned = false;
// 后台定时查询出错时：连不上服务、登录过期（页面上有没保存的修改）都要在侧边栏如实显示
function onDevicesError(e) {
  if (isOffline(e)) return setOnline(null);
  if (!e || !e.expired) return;
  setOnline(null, EXPIRED);
  if (!expiredWarned) {
    expiredWarned = true;
    toast("登录已过期（服务可能重启过）。页面上还有没保存的修改，保存会失败，请先把它们记下来，再刷新页面重新登录", true);
  }
}

// 侧边栏的在线设备数不管在哪一页都要跟着变：登录后每 5 秒查一次。
// 页面在后台时跳过；状态页、正在录入称呼的呼名页自己会查，这里也跳过，免得重复请求
let onlineTimer = null;
function watchOnline() {
  const refresh = async () => {
    if (document.hidden || page.name === "status" || (page.name === "calls" && page.timer)) return;
    try { setOnline((await api("devices", undefined, true)).devices); } catch (e) { onDevicesError(e); }
  };
  clearInterval(onlineTimer);
  refresh();
  onlineTimer = setInterval(refresh, 5000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && onlineTimer) watchOnline(); });

// ---------- 状态 ----------

const MODULE_PAGES = { LLM: "llm", ASR: "asr", TTS: "tts", Intent: "intent" };
const MODULE_TITLES = { LLM: "大模型", ASR: "语音识别", TTS: "语音合成", Intent: "意图识别" };
const INTENT_LABEL = { nointent: "不用插件", function_call: "用插件" };

function duration(sec) {
  if (sec < 60) return "刚刚连接";
  if (sec < 3600) return `已连接 ${Math.floor(sec / 60)} 分钟`;
  return `已连接 ${Math.floor(sec / 3600)} 小时 ${Math.floor((sec % 3600) / 60)} 分`;
}

async function renderStatus(root) {
  const [s, dev, tts] = await Promise.all([api("status"), api("devices"), api("tts")]);
  setOnline(dev.devices);
  const voice = tts.voices.find((v) => v.value === tts.voice);
  const tiles = Object.entries(s.modules).map(([k, m]) => {
    const value = k === "Intent" ? (INTENT_LABEL[m.type] || m.selected) : m.selected;
    const detail = k === "TTS" && voice ? `音色：${voice.name}` : k === "Intent" ? m.selected : m.type;
    return `<button class="card tile" data-go="${MODULE_PAGES[k]}">
      <div class="k">${MODULE_TITLES[k]}</div><div class="v">${esc(value)}</div>
      <div class="d">${m.running && m.running !== m.selected ? `<span class="pill warn">运行中仍是 ${esc(m.running)}</span>` : esc(detail)}</div></button>`;
  }).join("");
  const addr = [["本机 IP", s.addresses.ip], ["OTA 地址", s.addresses.ota], ["管理后台", s.addresses.admin]];
  const levelPill = { ok: '<span class="pill ok">正常</span>', warn: '<span class="pill warn">注意</span>', error: '<span class="pill err">异常</span>' };
  const bad = s.checks.filter((c) => c.level !== "ok").length;
  root.innerHTML = `
    <div class="page-head"><div><h1>状态</h1><p class="sub">服务运行情况、在线设备和连接地址。</p></div>
      <button class="btn" id="refresh">刷新</button></div>
    <div class="tiles">${tiles}</div>
    <div class="section-title">在线设备</div>
    <div class="card" id="devices"></div>
    <div class="section-title">连接地址</div>
    <div class="card panel">
      <p class="muted small" style="margin:0 0 12px">设备配网时填写 OTA 地址。请在路由器里给这台电脑设置固定 IP，否则 IP 变了设备会连不上。</p>
      <div class="kv">${addr.map(([k, v]) => `<div class="k">${k}</div><code>${esc(v)}</code>
        <button class="btn sm copy" data-copy="${esc(v)}">复制</button>`).join("")}</div>
    </div>
    <div class="section-title">环境自检 ${bad ? `<span class="pill warn">${bad} 项需要注意</span>` : '<span class="pill ok">全部正常</span>'}</div>
    <div class="card rows">${s.checks.map((c) => `<div><b>${esc(c.name)}</b>${levelPill[c.level] || ""}<span class="muted">${esc(c.detail)}</span></div>`).join("")}</div>`;
  root.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => openPage(b.dataset.go)));
  root.querySelectorAll("[data-copy]").forEach((b) => (b.onclick = () => copyText(b.dataset.copy)));
  $("refresh").onclick = (e) => busy(e.target, () => openPage("status", true));
  renderDevices(dev);
  // 平时每 5 秒查一次；有设备在做表情测试时每 1.5 秒查一次，让进度跟上设备屏幕
  let last = Date.now();
  page.timer = setInterval(async () => {
    const testing = (lastDevices?.devices || []).some((d) => d.emotion_test && d.emotion_test.running);
    if (document.hidden || (!testing && Date.now() - last < 5000)) return;
    last = Date.now();
    try { const d = await api("devices", undefined, true); setOnline(d.devices); renderDevices(d); }
    catch (e) { onDevicesError(e); if (isOffline(e)) devicesOffline(); }
  }, 1500);
}

const openEmotion = new Set();  // 展开了表情测试的设备
let lastDevices = null;  // 最近一次查到的在线设备，状态页据此决定多久再查
// 连不上服务时不能继续显示上一次的列表，否则侧边栏说"连不上服务"，这里还列着设备
function devicesOffline() {
  const box = $("devices");
  if (!box || box.dataset.key === "offline") return;
  box.dataset.key = "offline";
  box.innerHTML = '<div class="panel muted">连不上服务，设备列表暂停更新。服务恢复后会自动刷新。</div>';
}
function renderDevices(dev) {
  lastDevices = dev;
  const box = $("devices");
  if (!box) return;
  if (!dev.devices.length) {
    box.dataset.key = "";
    box.innerHTML = '<div class="panel muted">暂无设备在线。唤醒设备后会自动出现在这里。</div>';
    return;
  }
  const key = JSON.stringify(dev.devices.map((d) => [d.session_id, d.model_label, d.emotion_test, openEmotion.has(d.session_id)]));  // 设备切了模型也要重绘
  if (box.dataset.key === key) {  // 只更新连接时长，避免重绘打断点击
    box.querySelectorAll("[data-since]").forEach((el) => (el.textContent = duration(dev.now - +el.dataset.since)));
    return;
  }
  box.dataset.key = key;
  box.innerHTML = dev.devices.map((d) => {
    const t = d.emotion_test, open = openEmotion.has(d.session_id), running = t && t.running;
    const progress = !t ? "点一个表情单独发送，或者依次播放全部，对照设备屏幕看哪些有变化。"
      : running ? `正在依次播放：第 ${t.index}/${t.total} 个 ${t.emoji} ${esc(t.emotion)}`
      : t.stopped ? `已停止（播放到第 ${t.index}/${t.total} 个）。` : "依次播放已结束。";
    return `<div class="device" data-sid="${esc(d.session_id)}">
      <div class="device-top"><span class="dot on"></span><b class="mono">${esc(d.device_id || "未知设备")}</b>
        ${d.model_label ? `<span class="pill" title="这台设备此刻在跟谁说话（叫称呼切换）；和大模型页的全局默认是两回事">当前：${esc(d.model_label)}</span>` : ""}
        <span class="muted small">${esc(d.ip || "")}</span><span class="muted small" data-since="${d.connected_at}">${duration(dev.now - d.connected_at)}</span>
        <button class="btn sm" data-act="toggle" style="margin-left:auto">${open ? "收起" : "表情测试"}</button></div>
      ${open ? `<p class="muted small" style="margin:10px 0 0">${progress}</p>
        <div class="emogrid">${dev.emotions.map((e) => `<button class="emo ${running && t.emotion === e.emotion ? "now" : ""}" data-emo="${e.emotion}">
          <span>${e.emoji}</span><small>${esc(e.label)}</small></button>`).join("")}</div>
        <div class="actions" style="justify-content:flex-start">
          <button class="btn sm primary" data-act="all" ${running ? "disabled" : ""}>依次播放全部（每个 2 秒）</button>
          <button class="btn sm" data-act="stop" ${running ? "" : "disabled"}>停止</button></div>` : ""}
    </div>`;
  }).join("");
  box.querySelectorAll(".device").forEach((el) => {
    const sid = el.dataset.sid, url = `devices/${encodeURIComponent(sid)}/`;
    const act = (name) => el.querySelector(`[data-act="${name}"]`);
    const refresh = async () => { box.dataset.key = ""; renderDevices(await api("devices")); };
    act("toggle").onclick = () => { openEmotion.has(sid) ? openEmotion.delete(sid) : openEmotion.add(sid); refresh(); };
    if (act("all")) act("all").onclick = (e) => busy(e.target, async () => {
      try { await api(url + "emotion-test", {}); await refresh(); } catch (err) { toast(err.message, true); } });
    if (act("stop")) act("stop").onclick = (e) => busy(e.target, async () => {
      try { await api(url + "emotion-test/stop", {}); await refresh(); } catch (err) { toast(err.message, true); } });
    el.querySelectorAll("[data-emo]").forEach((b) => (b.onclick = async () => {
      try { await api(url + "emotion", { emotion: b.dataset.emo }); toast(`已发送 ${b.querySelector("span").textContent} ${b.dataset.emo}`); await refresh(); }
      catch (err) { toast(err.message, true); }
    }));
  });
}

// ---------- 工作原理 ----------

const SOURCE_PILL = { "服务端": "ok", "Claude Code": "warn" };
async function renderHow(root) {
  const d = await api("pipeline");
  const f = d.flow, p = d.prompt, m = p.marks;
  const markRe = new RegExp(`${m.start}(\\w+)${m.sep}([\\s\\S]*?)${m.end}`, "g");
  const highlight = (text) => esc(text).replace(markRe, (_, name, value) => {
    const label = p.var_labels[name] || name;
    if (name === "base_prompt") return `<mark class="persona"><i>${esc(label)}</i>${value}</mark>`;
    return value.trim() ? `<mark title="${esc(name)}"><i>${esc(label)}</i>${value}</mark>` : `<mark title="${esc(name)}"><i>${esc(label)}</i>（空）</mark>`;
  });
  const plain = (text) => text.replace(markRe, (_, name, value) => value);
  const stage = (s) => {
    const body = `<div class="ico">${s.icon}</div><b>${esc(s.title)}</b><span class="mod">${esc(s.value)}</span><small>${esc(s.hint)}</small>`;
    return s.page ? `<button class="stage" data-go="${esc(s.page)}" title="去设置">${body}</button>` : `<div class="stage static">${body}</div>`;
  };
  root.innerHTML = `
    <div class="page-head"><div><h1>工作原理</h1><p class="sub">说一句话之后会发生什么、可以怎么跟它说话。内容按当前配置生成，修改设置后会跟着变。</p></div></div>
    <div class="section-title">一句话怎么走 <span class="muted small" style="font-weight:400">点一步去改它的设置</span></div>
    <div class="flow">${f.stages.map((s, i) => `${i ? '<span class="arrow">→</span>' : ""}${stage(s)}`).join("")}</div>

    <div class="section-title">怎么跟它说话</div>
    <div class="tips">${f.tips.map((t) => `<div class="card tip"><b>${esc(t.title)}</b>
      <div class="say">${esc(t.say)}</div><div class="res">${esc(t.result)}</div></div>`).join("")}</div>

    <div class="section-title">发给大模型的提示词 <span class="muted small" style="font-weight:400">调人设、排查回答不对劲时用得上</span></div>
    <details class="prompt-all">
      <summary class="card"><b>发给 ${esc(p.llm)} 的内容</b><span class="pill">${p.segments.length} 段，按顺序拼在一起</span>
        <span class="toggle">展开 / 收起</span></summary>
      ${p.warnings.map((w) => `<div class="banner warn">${esc(w)}</div>`).join("")}
      ${p.segments.map((s, i) => `<details class="card seg-card pseg" ${s.collapsed ? "" : "open"}>

          <span class="pill ${SOURCE_PILL[s.source] ?? ""}">来源：${esc(s.source)}</span><span class="pill">${esc(s.when)}</span>

          <div class="actions" style="margin:0;padding:0 22px 14px"><button class="btn sm" data-copyseg="${i}">复制这段</button></div>` : ""}
      </details>`).join("")}
      ${p.actual ? `<details class="card seg-card pseg"><summary class="seg-head"><b>在线设备 ${esc(p.actual.device_id || "")} 实际使用的系统提示词</b>
          <span class="toggle">展开 / 收起</span></summary>
        <p class="seg-note">这是这台设备连接时真正生成的版本（第 ${p.segments.findIndex((s) => s.id === "base") + 1} 段），可以和上面的预览对照。</p>
        <pre class="prompt-text">${esc(p.actual.text)}</pre></details>` : ""}
    </details>

    <p class="how-foot">每一步为什么这样设计、连接和 Claude Code 进程什么时候启动和关闭、哪些记录会保存，见 GitHub 上的
      <a href="${esc(d.design_url)}" target="_blank" rel="noopener">设计细节 ↗</a>。</p>`;
  root.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => openPage(b.dataset.go)));
  root.querySelectorAll("[data-copyseg]").forEach((b) => (b.onclick = () => copyText(plain(p.segments[+b.dataset.copyseg].text))));
}

  const defaultPill = (on) => (on ? '<span class="pill ok">默认模型</span>' : "");

  root.innerHTML = `
    <div class="page-head"><div><h1>大模型</h1><p class="sub">设备刚连上时用默认模型。给模型配了称呼后，句子开头说“嗨 + 称呼”就换成它，几个模型可以同时用（称呼在<a href="#calls">呼名</a>页配）。</p></div>
      <span class="pill ${d.kind === "other" ? "warn" : "ok"}">默认：${esc(current)}</span></div>
    ${d.kind === "other" ? `<div class="banner warn">当前默认的 ${esc(d.selected)} 不在后台管理范围内（可能是手动改了配置文件）。在下面选择一种并点"保存并设为默认"即可切换。</div>` : ""}
    ${d.running && d.running !== d.selected ? `<div class="banner warn">配置里的默认模型是 ${esc(d.selected)}，但服务仍在用 ${esc(d.running)}。</div>` : ""}

    <div class="section-title">本地 CLI 与智能体 · 用你自己的账号，不走下面的 API Key</div>
    <div class="choices three">
      <div class="choice ${usingCli ? "on" : ""}">
        <div class="mark" style="background:#fef3c7;color:#b45309">C</div>
        <div><b>Claude Code CLI</b> ${defaultPill(usingCli)} ${callPill("ClaudeCLI")}
          <small>${inst.installed ? esc(`${inst.version} · ${inst.path}`) : '<span style="color:var(--err)">没有找到 Claude Code，请先安装并登录</span>'}</small></div>
      </div>
      <div class="choice off" title="即将支持">
        <div class="mark" style="background:var(--soft);color:var(--muted)">X</div>
        <div><b>Codex CLI</b> <span class="pill">即将支持</span><small>OpenAI 的本地编程助手</small></div>
      </div>
      <div class="choice ${d.kind === "grok" ? "on" : ""}" id="grok-choice" style="cursor:pointer" title="打开 Grok Bot 页">
        <div class="mark" style="background:#e0f2fe;color:#0369a1">G</div>
        <div><b>Grok Bot</b> ${defaultPill(d.kind === "grok")} ${grokAliases.length ? `<span class="pill">称呼：${esc(grokAliases.slice(0, 3).join("、"))}${grokAliases.length > 3 ? "…" : ""}</span>` : ""}
          <small>${d.grok.bots.length ? `已勾选 ${d.grok.bots.length} 个 Bot${grokAliases.length < d.grok.bots.length ? "，有的还没配称呼" : ""}，叫名字就能派活` : "xAI 的云端 AI 同事：登录、勾选 Bot，叫名字派活，回复念给你听"}</small></div>
      </div>
    </div>
    <div class="card panel" id="cli-form">
      ${c.exists ? `
      ${usingCli ? "" : `<div class="banner info">本地 CLI 不是默认模型${active ? `（默认是 ${esc(active.label)}）` : ""}${d.callable.ClaudeCLI ? "，但配了称呼，说“嗨 Claude”就能用它" : ""}。这里改的设置保存后，设备重新连接时生效；想让它当默认模型就点"保存并设为默认"。</div>`}
      <div class="cli-row"><div class="cli-k">模型</div><div>
        <div class="seg" data-k="model">${c.options.model.map((o) => `<button type="button" data-v="${o.value}" class="${o.value === v.model ? "on" : ""}">${o.label}<small>${esc(o.hint)}</small></button>`).join("")}
          <button type="button" data-v="__custom" class="${customModel ? "on" : ""}">自定义<small>填完整模型名</small></button></div>
        <input class="in mono hidden" id="model-custom" data-k="model_custom" value="${esc(customModel ? v.model : "")}" placeholder="例如 claude-sonnet-5-5" style="max-width:320px">
      </div></div>
      <div class="cli-row"><div class="cli-k">思考级别</div><div>
        <div class="seg" data-k="effort">${c.options.effort.map((o) => `<button type="button" data-v="${o.value}" class="${o.value === (v.effort || "") ? "on" : ""}">${o.label}</button>`).join("")}</div>
        <div class="small muted" style="margin-top:6px">越高想得越久、回复越慢。<span id="effort-note" class="hidden" style="color:var(--warn)">超高和最高可能要等十几秒才开口，语音对话不推荐。</span></div>
      </div></div>
      <div class="cli-row"><div class="cli-k">权限级别</div><div>
        ${c.level === "custom" ? '<div class="banner warn" style="margin:0 0 10px">当前的工具和权限模式是手动配置的，和下面三档都对不上。选一档保存后会按这档重新设置。</div>' : ""}
        <div class="levels">${c.options.level.map((lv) => `<button type="button" class="level ${lv.value === c.level ? "on" : ""} ${lv.value}" data-level="${lv.value}">
          <b>${esc(lv.label)}</b><small>${esc(lv.desc)}</small></button>`).join("")}</div>
        <label class="switch"><input type="checkbox" data-k="web" ${c.web ? "checked" : ""}><span>允许联网搜索</span>
          <small>可以搜索网页、打开网页，回答实时问题会多等几秒</small></label>
      </div></div>
      <div class="grid2" style="margin-top:6px">
        <label class="f">工作目录<span class="hint">读写文件只能在这个目录里</span><input class="in mono" data-k="workdir" value="${esc(v.workdir || "")}"></label>
        <label class="f">填充语<span class="hint">回复慢时先说这句，留空关闭</span><input class="in" data-k="first_reply_filler" value="${esc(v.first_reply_filler || "")}"></label>
      </div>
      <details class="adv"><summary>高级设置（超时、自动接续、当前开放的工具）</summary>
        <div class="grid3">
          ${num("turn_timeout_seconds", "单轮超时（秒）", "一个任务最长做多久，默认 600，填 0 不限制")}
          ${num("stall_timeout_seconds", "无响应超时（秒）", "卡住多久就中断；执行工具时不算，填 0 不检查")}
          ${num("idle_timeout_seconds", "空闲关闭进程（秒）", "填 0 每轮结束就关闭")}
          ${num("background_max_seconds", "后台最长（秒）", "打断、断开、单轮超时时 Claude 还在干活就转后台接着做，做完再汇报；最长做多久，默认 7200，填 0 打断就停")}
          ${num("background_after_seconds", "算作长任务（秒）", "用过工具、或做了这么久才转后台；更短的聊天被打断直接停，默认 30")}
          ${num("resume_window_minutes", "自动接续（分钟）", "这段时间内重连接着聊，填 0 只在说接续指令时接上")}
          ${num("filler_delay_seconds", "填充语等待（秒）")}
          ${num("progress_interval_seconds", "进度提示间隔（秒）", "第一次提示前等多久，之后逐渐拉长到 4 倍；默认 30，填 0 关闭")}
          <label class="f">进度提示<span class="hint">第一次说这句，之后报已用时间；留空用默认的“还在处理，请稍等”</span>
            <input class="in" data-k="progress_reply" value="${esc(v.progress_reply || "")}" placeholder="还在处理，请稍等"></label>
          <label class="f full">接续关键字<span class="hint">超过自动接续时间后，说这些话会接着上次的对话，用逗号分隔</span>
            <input class="in" data-k="resume_keywords" value="${esc((v.resume_keywords || []).join("，"))}"></label>
          <label class="f full">CLI 路径<span class="hint">留空自动查找</span><input class="in mono" data-k="cli_path" value="${esc(v.cli_path || "")}"></label>
          <div class="full"><label class="f">当前开放的工具<span class="hint">由权限级别和联网开关决定，权限模式 ${esc(v.permission_mode || "default")}</span></label>
            <div class="chips">${(v.allowed_tools || []).map((t) => { const info = c.options.tools.find((x) => x.name === t);
              return `<span class="chip on ${info && info.risky ? "risky" : ""}">${esc(t)}${info ? " " + esc(info.label) : ""}</span>`; }).join("")}</div></div>
        </div>
      </details>
      <div class="actions"><span class="result" id="cli-result"></span>
        <button class="btn" id="cli-reset">撤销修改</button>
        <button class="btn ${usingCli ? "primary" : ""}" id="cli-save">保存</button>
        ${usingCli ? "" : `<button class="btn primary" id="cli-use" ${inst.installed ? "" : "disabled"}>保存并设为默认</button>`}
      </div>` : '<div class="muted">配置文件里没有 ClaudeCLI 条目，请重新运行安装脚本生成配置。</div>'}
    </div>

    <div class="section-title">API Key · 云端模型，统一走 OpenAI 协议</div>
    <div class="vendors">${d.vendors.map((x) => `<button class="vendor ${x.id === llmVendor ? "on" : ""} ${d.vendor === x.id ? "using" : ""}" data-vendor="${x.id}">
      <i class="${x.configured ? "set" : ""}"></i><b>${esc(x.label)}</b>
      <small>${d.vendor === x.id ? "✓ 默认" : x.configured ? (d.callable[x.entry] ? `称呼：${esc(d.callable[x.entry][0])}` : "已配置") : "未配置"}</small></button>`).join("")}</div>
    <div class="card panel" id="api-form"></div>`;

  $("grok-choice").onclick = () => openPage("grokbot");

  // ----- 本地 CLI -----
  const form = $("cli-form");
  const segValue = (k) => { const on = form.querySelector(`.seg[data-k="${k}"] .on`); return on ? on.dataset.v : ""; };
  const cliValues = () => {
    const out = {};
    form.querySelectorAll("input[data-k], select[data-k]").forEach((el) => (out[el.dataset.k] = el.type === "checkbox" ? el.checked : el.value));
    out.model = segValue("model") === "__custom" ? out.model_custom.trim() : segValue("model");
    delete out.model_custom;
    out.effort = segValue("effort");
    out.level = (form.querySelector("[data-level].on") || {}).dataset?.level || c.level;
    out.resume_keywords = (out.resume_keywords || "").split(/[,，]/).map((s) => s.trim()).filter(Boolean);
    return out;
  };
  let cliDirty = () => false;
  if (c.exists) {
    const result = (html) => ($("cli-result").innerHTML = html);
    const syncModel = () => $("model-custom").classList.toggle("hidden", segValue("model") !== "__custom");
    const syncEffort = () => $("effort-note").classList.toggle("hidden", !(c.options.effort.find((o) => o.value === segValue("effort")) || {}).slow);
    form.querySelectorAll(".seg button").forEach((b) => (b.onclick = () => {
      b.parentElement.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
      syncModel(); syncEffort();
    }));
    form.querySelectorAll("[data-level]").forEach((b) => (b.onclick = () => {
      const lv = b.dataset.level;
      if (lv !== "read" && !b.classList.contains("on") && !confirm(lv === "auto"
          ? "Auto：Claude 可以在电脑上执行命令，由它自己判断风险，低风险的会自动执行。语音可能被误识别，确定开启吗？"
          : "可编辑：Claude 可以在工作目录里新建和修改文件，不再询问。确定开启吗？")) return;
      form.querySelectorAll("[data-level]").forEach((x) => x.classList.toggle("on", x === b));
    }));
    syncModel(); syncEffort();
    cliDirty = snapshot(cliValues);
    $("cli-reset").onclick = () => { page.dirty = null; openPage("llm", true); };
    $("cli-save").onclick = (e) => busy(e.target, async () => {
      try {
        const r = await api("llm/claude", cliValues());
        toast(r.changed.length ? r.note : "没有修改", r.failed); page.dirty = null; await openPage("llm", true);
      } catch (err) { result(`<span style="color:var(--err)">${esc(err.message)}</span>`); }
    });
    if ($("cli-use")) $("cli-use").onclick = (e) => busy(e.target, async () => {
      try {
        await api("llm/claude", cliValues());
        const r = await api("llm/use", { kind: "cli" });
        toast(r.note, r.failed); page.dirty = null; await openPage("llm", true);
      } catch (err) { result(`<span style="color:var(--err)">${esc(err.message)}</span>`); }
    });
  }

  // ----- API Key -----
  let apiDirty = () => false;
  const renderApi = () => {
    const x = d.vendors.find((y) => y.id === llmVendor), using = d.vendor === x.id;
    const box = $("api-form");
    box.innerHTML = `
      ${using ? "" : `<div class="banner info">${esc(x.label)} 不是默认模型${active ? `（默认是 ${esc(active.label)}）` : ""}${d.callable[x.entry] ? `，但配了称呼“${esc(d.callable[x.entry][0])}”，叫名字就能用它` : "。填好保存后到呼名页配上称呼，就能叫名字用它"}；想让它当默认模型就点"保存并设为默认"。</div>`}
      ${x.conflict ? `<div class="banner err">配置里已有一个叫 ${esc(x.entry)} 的条目，但不是 OpenAI 兼容类型，请在配置文件里改名或删掉它。</div>` : ""}
      ${x.hint ? `<div class="banner info">${esc(x.hint)}</div>` : ""}
      <div class="grid2">
        <label class="f">接口地址<input class="in mono" id="api-url" value="${esc(x.base_url)}" placeholder="https://…/v1"></label>
        <label class="f">模型${x.models.length ? '<span class="hint">可从列表选，也可以手填</span>' : ""}
          <input class="in mono" id="api-model" value="${esc(x.model)}" list="api-models" placeholder="模型名称">
          <datalist id="api-models">${x.models.map((m) => `<option value="${esc(m)}">`).join("")}</datalist></label>
        <label class="f full">API Key${x.id === "custom" ? '<span class="hint">本机服务不需要 Key 时可以留空</span>' : ""}
          <input class="in mono" id="api-key" type="password" autocomplete="off"
            placeholder="${x.key_set ? `已设置 ${esc(x.key_hint)}，输入新值可替换` : "未设置，粘贴后保存"}"></label>
      </div>
      <p class="muted small" style="margin:8px 0 0">Key 只保存在这台电脑的配置文件里，页面上只显示首尾 4 位。</p>
      <div class="actions"><span class="result" id="api-result"></span>
        <button class="btn" id="api-test">测试连接</button>
        <button class="btn ${using ? "primary" : ""}" id="api-save">保存</button>
        ${using ? "" : '<button class="btn primary" id="api-use">保存并设为默认</button>'}</div>`;
    const values = () => ({ base_url: $("api-url").value.trim(), model: $("api-model").value.trim(), api_key: $("api-key").value.trim() });
    apiDirty = snapshot(values);
    const result = (html) => ($("api-result").innerHTML = html);
    const bad = (msg) => result(`<span style="color:var(--err)">${esc(msg)}</span>`);
    $("api-test").onclick = (e) => busy(e.target, async () => {
      result('<span class="muted">正在发一句话测试…</span>');
      try {
        const r = await api(`llm/vendors/${x.id}/test`, values());
        result(`<span style="color:var(--ok)">✓ 连接正常，${r.seconds < 1 ? "不到 1 秒" : r.seconds + " 秒"}收到回复“${esc(r.reply)}”</span>`);
      }
      catch (err) { bad(err.message); }
    });
    $("api-save").onclick = (e) => busy(e.target, async () => {
      try { const r = await api(`llm/vendors/${x.id}`, values()); toast(r.changed.length ? r.note : "没有修改", r.failed); page.dirty = null; await openPage("llm", true); }
      catch (err) { bad(err.message); }
    });
    if ($("api-use")) $("api-use").onclick = (e) => busy(e.target, async () => {
      try {
        await api(`llm/vendors/${x.id}`, values());
        const r = await api("llm/use", { kind: "api", vendor: x.id });
        toast(r.note, r.failed); page.dirty = null; await openPage("llm", true);
      } catch (err) { bad(err.message); }
    });
  };
  root.querySelectorAll("[data-vendor]").forEach((b) => (b.onclick = () => {
    if (apiDirty() && !confirm("这个厂商的修改还没保存，确定切换吗？")) return;
    llmVendor = b.dataset.vendor;
    root.querySelectorAll("[data-vendor]").forEach((y) => y.classList.toggle("on", y === b));
    renderApi();
  }));
  renderApi();
  page.dirty = () => cliDirty() || apiDirty();
}

      <button class="choice ${asrView === "doubao" ? "on" : ""}" data-asr="doubao">
        <div class="mark" style="background:#e0f2fe;color:#0369a1">豆</div>
        <div><b>豆包流式语音识别</b> ${tag(d.choice === "doubao", b.configured)}

    <div class="card panel" id="asr-form"></div>
    ${vadCard(d.vad)}
    ${hotwordsCard(d.hotwords)}
    <div class="card" style="margin-top:16px" id="cor-card"></div>
    ${recentCard(d.recent)}
    <p class="muted small" style="margin-top:14px">其他语音识别方案（阿里、讯飞、其他本地模型）暂不支持在后台设置。</p>`;
  let formDirty = () => false;
  const use = (btn, choice, before) => busy(btn, async () => {
    try {
      if (before) await before();
      const r = await api("asr/use", { choice });
      toast(r.note, r.failed); page.dirty = null; await openPage("asr", true);
    } catch (err) { toast(err.message, true); }
  });
  const renderForm = () => {
    const box = $("asr-form");
    if (asrView === "local") {
      const using = d.choice === "local";
      box.innerHTML = !d.local.exists ? '<div class="muted">配置文件里没有 SherpaXASR 条目，请重新运行安装脚本生成配置。</div>' : `
        <p style="margin:0 0 14px">${esc(d.local.label)}</p>
        <div class="kv" style="grid-template-columns:max-content minmax(0,1fr)">
          ${using ? d.info.map((i) => `<div class="k">${esc(i.label)}</div><code>${esc(i.value)}</code>`).join("") : ""}
          ${lm ? `<div class="k">模型文件</div><div style="color:${lm.ok ? "var(--ok)" : "var(--err)"}">${esc(lm.detail)}</div>` : ""}
        </div>
        ${using ? "" : `<div class="actions"><span class="result muted">切换后新连接马上生效，在线设备重新连接后生效。</span>
          <button class="btn primary" id="local-use" ${lm && lm.ok ? "" : "disabled"}>使用本地 X-ASR</button></div>`}`;
      formDirty = () => false;
      if ($("local-use")) $("local-use").onclick = (e) => use(e.target, "local");
      return;
    }
    const using = d.choice === "doubao";
    box.innerHTML = `
      ${b.conflict ? `<div class="banner err">配置里已有一个叫 ${esc(b.entry)} 的条目，但不是豆包流式识别，请在配置文件里改名或删掉它。</div>` : ""}
      <p style="margin:0 0 14px">在<a href="https://console.volcengine.com/speech/service/10038" target="_blank" rel="noopener">火山引擎控制台</a>开通“豆包流式语音识别模型 2.0”后，把密钥填在这里。
        新版控制台只有一个 API Key；旧版控制台是 APP ID 加 Access Token。</p>
      <div class="cli-row"><div class="cli-k">控制台版本</div><div>
        <div class="seg" id="db-auth"><button type="button" data-v="key" class="${b.auth === "key" ? "on" : ""}">新版 · API Key</button>
          <button type="button" data-v="app" class="${b.auth === "app" ? "on" : ""}">旧版 · APP ID + Access Token</button></div></div></div>
      <div class="grid2" style="margin-top:6px">
        <label class="f full" data-auth="key">API Key
          <input class="in mono" id="db-key" type="password" autocomplete="off"
            placeholder="${b.key_set ? `已设置 ${esc(b.key_hint)}，输入新值可替换` : "未设置，粘贴后保存"}"></label>
        <label class="f" data-auth="app">APP ID<input class="in mono" id="db-appid" value="${esc(b.appid)}" placeholder="一串数字"></label>
        <label class="f" data-auth="app">Access Token
          <input class="in mono" id="db-token" type="password" autocomplete="off"
            placeholder="${b.token_set ? `已设置 ${esc(b.token_hint)}，输入新值可替换` : "未设置，粘贴后保存"}"></label>
      </div>
      <div class="cli-row" style="margin-top:6px"><div class="cli-k">计费方式</div><div>
        <div class="seg" id="db-res">${b.resources.map((r) => `<button type="button" data-v="${esc(r.value)}" class="${r.value === b.resource_id ? "on" : ""}">${esc(r.label)}<small>${esc(r.hint)}</small></button>`).join("")}</div>
        <div class="small muted" style="margin-top:6px">要和控制台里开通的一致，不一致会提示鉴权失败。</div></div></div>
      <p class="muted small" style="margin:8px 0 0">密钥只保存在这台电脑的配置文件里，页面上只显示首尾 4 位。下面的热词会直接带给豆包；识别后纠错照常生效。</p>
      <div class="actions"><span class="result" id="db-result"></span>
        <button class="btn" id="db-test">测试连接</button>
        <button class="btn ${using ? "primary" : ""}" id="db-save">保存</button>
        ${using ? "" : '<button class="btn primary" id="db-use">保存并使用</button>'}</div>`;
    const seg = (id) => ($(id).querySelector(".on") || {}).dataset?.v || "";
    const syncAuth = () => box.querySelectorAll("[data-auth]").forEach((el) => el.classList.toggle("hidden", el.dataset.auth !== seg("db-auth")));
    box.querySelectorAll(".seg button").forEach((x) => (x.onclick = () => {
      x.parentElement.querySelectorAll("button").forEach((y) => y.classList.toggle("on", y === x));
      syncAuth();
    }));
    syncAuth();
    const values = () => ({ auth: seg("db-auth"), api_key: $("db-key").value.trim(), appid: $("db-appid").value.trim(),
      access_token: $("db-token").value.trim(), resource_id: seg("db-res") });
    formDirty = snapshot(values);
    const result = (html) => ($("db-result").innerHTML = html);
    const bad = (msg) => result(`<span style="color:var(--err)">${esc(msg)}</span>`);
    $("db-test").onclick = (e) => busy(e.target, async () => {
      result('<span class="muted">正在连接豆包识别服务…</span>');
      try {
        const r = await api("asr/doubao/test", values());
        result(`<span style="color:var(--ok)">✓ 连接正常，${r.seconds < 1 ? "不到 1 秒" : r.seconds + " 秒"}收到回应</span>`);
      } catch (err) { bad(err.message); }
    });
    $("db-save").onclick = (e) => busy(e.target, async () => {
      try { const r = await api("asr/doubao", values()); toast(r.changed.length ? r.note : "没有修改", r.failed); page.dirty = null; await openPage("asr", true); }
      catch (err) { bad(err.message); }
    });
    if ($("db-use")) $("db-use").onclick = (e) => use(e.target, "doubao", () => api("asr/doubao", values()));
  };
  root.querySelectorAll("[data-asr]").forEach((x) => (x.onclick = () => {
    if (x.dataset.asr === asrView) return;
    if (formDirty() && !confirm("这里的修改还没保存，确定切换吗？")) return;
    asrView = x.dataset.asr;
    root.querySelectorAll("[data-asr]").forEach((y) => y.classList.toggle("on", y === x));
    renderForm();
  }));
  renderForm();
  asrChecks = [() => formDirty(), bindVad(d.vad), bindHotwords(d.hotwords), bindCorrections(d.corrections)];
  page.dirty = () => asrChecks.some((f) => f && f());
  bindRecent(root);
}

// 各卡片分别保存；保存后重新打开本页，显示服务端整理后的结果。own 是这张卡片的“有没有修改”检查
let asrChecks = [];
const saveAndReload = (target, path, body, own) => {
  if (asrChecks.some((f) => f && f !== own && f())
      && !confirm("其他卡片还有没保存的修改，保存这里后页面会刷新，那些修改会丢掉。继续吗？")) return;
  return busy(target, async () => {
    try { const r = await api(path, body); toast(r.note, r.failed); page.dirty = null; await openPage("asr", true); }
    catch (err) { toast(err.message, true); }
  });
};

function bindVad(v) {
  if (!v.supported) return null;
  const input = $("vad-silence");
  const dirty = () => input.value.trim() !== String(v.silence_ms);
  $("vad-save").onclick = (e) => saveAndReload(e.target, "vad", { silence_ms: input.value.trim() }, dirty);
  return dirty;
}

// ---------- 热词 ----------

function hotwordsCard(h) {
  return `
    <div class="card" style="margin-top:16px">
      <div class="card-head"><h2>热词</h2><span class="pill">${h.words.length + h.auto.length} 个</span></div>
      <div class="panel ${h.supported ? "" : "disabled-area"}">
        <p style="margin:0">容易认错的专有名词，识别时优先考虑，比如 GitHub、StackChan。只能把发音接近的词救回来；发音完全一样的（Claude 总被听成 cloud），用下面的“识别后纠错”。
          写原本的大小写，一个词一项，不要太多（几十个以内），太多反而容易误认。</p>
        <div class="chips" id="hw-chips"></div>
        ${h.auto.length ? `<p class="muted small" style="margin:10px 0 0">虚线的来自<a href="#calls">呼名</a>里的模型名字，自动带上，在呼名页修改。</p>` : ""}
        ${h.dropped.length ? `<div class="banner warn" style="margin:10px 0 0">豆包一次最多带约 100 个 token 的热词，超出了，这 ${h.dropped.length} 个不会带上：${esc(h.dropped.join("、"))}。呼名里的模型名字会优先带上。</div>` : ""}
        <div style="display:flex;gap:8px;margin-top:12px;max-width:440px">
          <input class="in" id="hw-new" placeholder="添加热词，回车确认" ${h.supported ? "" : "disabled"}><button class="btn sm" id="hw-add" ${h.supported ? "" : "disabled"}>添加</button></div>
        <div class="actions"><span class="result muted">${h.supported ? "保存后重新加载语音识别：新连接马上生效，在线设备重新连接后生效。" : "当前语音识别不支持热词，支持的有本地 X-ASR、豆包。"}</span>
          <button class="btn primary" id="hw-save" ${h.supported ? "" : "disabled"}>保存热词</button></div>
      </div>
    </div>`;
}

function bindHotwords(h) {
  if (!h.supported) return null;
  const words = [...h.words];
  const draw = () => {
    $("hw-chips").innerHTML = words.map((w, i) => `<span class="chip on">${esc(w)}
        <button class="chip-x" data-del="${i}" title="删除" aria-label="删除 ${esc(w)}">×</button></span>`).join("")
      + h.auto.map((w) => `<span class="chip risky" title="来自呼名">${esc(w)}</span>`).join("")
      || '<span class="muted small">还没有热词</span>';
    $("hw-chips").querySelectorAll("[data-del]").forEach((b) => (b.onclick = () => { words.splice(+b.dataset.del, 1); draw(); }));
  };
  const add = () => {
    const input = $("hw-new"), w = input.value.replace(/\s+/g, " ").trim();
    if (!w) return;
    if (/[,，]/.test(w)) { toast("一个词一项，不要用逗号", true); return; }
    if (![...words, ...h.auto].some((x) => x.toLowerCase() === w.toLowerCase())) words.push(w);
    input.value = ""; draw();
  };
  $("hw-add").onclick = add;
  $("hw-new").onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); add(); } };
  const dirty = () => JSON.stringify(words) !== JSON.stringify(h.words) || !!$("hw-new").value.trim();
  $("hw-save").onclick = (e) => saveAndReload(e.target, "asr/hotwords", { words }, dirty);
  draw();
  return dirty;
}

// ---------- 识别后纠错 ----------

function bindCorrections(list) {
  const items = list.map((x) => ({ target: x.target, aliases: [...x.aliases] }));
  const original = JSON.stringify(items);
  const card = $("cor-card");
  const draw = () => {
    card.innerHTML = `
      <div class="card-head"><h2>识别后纠错</h2><span class="pill">${items.length} 条</span></div>
      <div class="panel">
        <p style="margin:0">识别出文字后，把认错的写法换成正确的，再交给大模型和设备显示。不区分大小写，中英文之间有没有空格都算；英文按整词替换，“cloud code” 不会改到 “cloud coder” 里。
          认错的写法至少 2 个字，太短容易误改普通的话。</p>
        ${items.map((it, i) => `
          <div class="cor-row" data-row="${i}" style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px">
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
              <span class="muted small">改成</span><input class="in" data-target value="${esc(it.target)}" style="max-width:220px">
              <button class="btn sm" data-del-row title="删除这一条">删除</button></div>
            <div class="chips">${it.aliases.map((a, j) => `<span class="chip on">${esc(a)}
              <button class="chip-x" data-del="${j}" title="删除" aria-label="删除 ${esc(a)}">×</button></span>`).join("")}</div>
            <div style="display:flex;gap:8px;margin-top:10px;max-width:440px">
              <input class="in" data-new placeholder="再加一种认错的写法"><button class="btn sm" data-add>添加</button></div>
          </div>`).join("")}
        <div style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px">
          <div class="section-title" style="margin-top:0">新增一条</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <input class="in" id="cor-alias" placeholder="认错的写法，如 cloud code" style="max-width:240px">
            <span class="muted small">改成</span>
            <input class="in" id="cor-target" placeholder="正确写法，如 Claude Code" style="max-width:240px">
            <button class="btn sm" id="cor-add">添加</button></div>
        </div>
        <div class="actions"><span class="result muted">保存后马上生效，在线设备不用重新连接。</span>
          <button class="btn primary" id="cor-save">保存纠错表</button></div>
      </div>`;
    card.querySelectorAll("[data-row]").forEach((row) => {
      const it = items[+row.dataset.row];
      row.querySelector("[data-target]").oninput = (e) => { it.target = e.target.value; };
      row.querySelector("[data-del-row]").onclick = () => { items.splice(+row.dataset.row, 1); draw(); };
      row.querySelectorAll("[data-del]").forEach((b) => (b.onclick = () => { it.aliases.splice(+b.dataset.del, 1); draw(); }));
      const input = row.querySelector("[data-new]");
      const add = () => { const a = input.value.trim(); if (a && !it.aliases.some((x) => x.toLowerCase() === a.toLowerCase())) it.aliases.push(a); draw(); };
      row.querySelector("[data-add]").onclick = add;
      input.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); add(); } };
    });
    $("cor-add").onclick = () => {
      const alias = $("cor-alias").value.trim(), target = $("cor-target").value.trim();
      if (!alias || !target) { toast("认错的写法和正确写法都要填", true); return; }
      const same = items.find((x) => x.target.toLowerCase() === target.toLowerCase());
      if (same) { if (!same.aliases.some((x) => x.toLowerCase() === alias.toLowerCase())) same.aliases.push(alias); }
      else items.push({ target, aliases: [alias] });
      draw();
    };
    $("cor-save").onclick = (e) => saveAndReload(e.target, "asr/corrections", { items }, dirty);
  };
  const dirty = () => JSON.stringify(items) !== original || !!($("cor-alias").value.trim() || $("cor-target").value.trim());
  draw();
  return dirty;
}

          </div>`).join("") : '<p class="muted small" style="margin:12px 0 0">还没有识别记录。跟设备说几句话后刷新本页。</p>'}
      </div>

function bindRecent(root) {
  $("recent-refresh").onclick = () => { if (confirmLeave()) openPage("asr", true); };
  root.querySelectorAll("[data-recent]").forEach((row) => {
    row.querySelectorAll("[data-to]").forEach((b) => {
      // 先记下选中的文字：点按钮时浏览器会清掉选区
      b.onmousedown = () => {
        const sel = window.getSelection();
        b.dataset.picked = sel && row.contains(sel.anchorNode) ? sel.toString().trim() : "";
      };
      b.onclick = () => {
        const whole = b.dataset.to === "cor" ? row.dataset.raw : row.querySelector("[data-text]").textContent.trim();
        const text = b.dataset.picked || whole;
        const input = $(b.dataset.to === "hw" ? "hw-new" : "cor-alias");
        if (!input || input.disabled) { toast("当前语音识别不支持热词", true); return; }
        input.value = text;
        input.scrollIntoView({ behavior: "smooth", block: "center" });
        input.focus();
        toast(b.dataset.to === "hw" ? "改成要加的词，再点“添加”" : "改成认错的那部分，填上正确写法，再点“添加”");
      };
    });
  });
}

// ---------- 语音合成 ----------

let audio = null;
async function renderTTS(root) {
  const d = await api("tts");
  const isEdge = d.type === "edge";
  let chosen = d.voice;
  const groups = [];
  d.voices.forEach((v) => { let g = groups.find((x) => x.name === v.group); if (!g) groups.push(g = { name: v.group, items: [] }); g.items.push(v); });
  const cur = d.voices.find((v) => v.value === d.voice);
  root.innerHTML = `
    <div class="page-head"><div><h1>语音合成</h1><p class="sub">把回复转成语音。EdgeTTS 免费、不需要 Key，换音色不用下载任何文件。</p></div>
      <span class="pill ok">当前：${esc(d.selected)}${cur ? ` · ${esc(cur.name)}` : ""}</span></div>
    ${isEdge ? "" : `<div class="banner warn">当前使用的是 ${esc(d.selected)}，后台只支持设置 EdgeTTS 的音色。</div>`}
    <div class="card panel ${isEdge ? "" : "disabled-area"}">
      ${groups.map((g) => `<div class="voice-group"><h3>${esc(g.name)}</h3><div class="voices">${g.items.map((v) => `
        <div class="voice ${v.value === chosen ? "on" : ""}" data-voice="${esc(v.value)}" role="button" tabindex="0">
          <div class="meta"><b>${esc(v.name)}</b> <span class="muted small">${esc(v.gender)}</span><small>${esc(v.style)}</small></div>
          <button class="play" data-play="${esc(v.value)}" title="试听">▶</button></div>`).join("")}</div></div>`).join("")}
      <div class="actions"><span class="result muted">保存后，设备重新连接时生效。</span>
        <button class="btn primary" id="tts-save">保存音色</button></div>
    </div>`;
  const pick = (el) => { chosen = el.dataset.voice; root.querySelectorAll(".voice").forEach((x) => x.classList.toggle("on", x === el)); };
  root.querySelectorAll(".voice").forEach((el) => {
    el.onclick = (e) => { if (!e.target.closest(".play")) pick(el); };
    el.onkeydown = (e) => { if (e.target === el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); pick(el); } };
  });
  const resetPlay = () => root.querySelectorAll(".play").forEach((x) => { x.classList.remove("playing"); x.textContent = "▶"; });
  root.querySelectorAll(".play").forEach((b) => (b.onclick = () => {
    const wasPlaying = b.classList.contains("playing");
    if (audio) { audio.pause(); audio = null; }
    resetPlay();
    if (wasPlaying) return;
    b.classList.add("playing"); b.textContent = "…";  // 第一次试听要先在线合成，约 1～2 秒
    const a = audio = new Audio("/admin/api/tts/preview?voice=" + encodeURIComponent(b.dataset.play));
    a.onplaying = () => { if (audio === a) b.textContent = "■"; };
    a.onended = resetPlay;
    a.onerror = () => { resetPlay(); toast("试听失败，请检查电脑能否访问微软的语音服务", true); };
    a.play().catch(() => {});
  }));
  page.dirty = () => chosen !== d.voice;
  $("tts-save").onclick = (e) => busy(e.target, async () => {
    try { const r = await api("tts", { voice: chosen }); toast(r.changed.length ? r.note : "没有修改", r.failed); page.dirty = null; await openPage("tts", true); }
    catch (err) { toast(err.message, true); }
  });
}

// ---------- 记忆：聊天记录里被截掉的旧对话总结成的"关于用户"的要点，每台设备一份，所有 API 模型共用 ----------
async function renderMemory(root) {
  const d = await api("memory");
  const st = d.settings;
  const SOURCE = { summary: "自动总结", manual: "后台修改", cleared: "已清空" };
  const fmt = (t) => (t ? new Date(t * 1000).toLocaleString("zh-CN", { hour12: false }) : "");
  const edits = {};  // device -> 编辑框里的内容（改过才有）
  page.dirty = () => d.devices.some((x) => edits[x.device] !== undefined && edits[x.device] !== x.memory.summary);
  const status = !st.enabled ? '<span class="pill">聊天记录未开启</span>'
    : st.summary ? '<span class="pill ok">自动总结已开启</span>' : '<span class="pill">自动总结已关闭</span>';
  root.innerHTML = `
    <div class="page-head"><div><h1>记忆</h1><p class="sub">聊天记录按设备和模型存在本机（data/chat.db），每次只把最近 ${st.max_messages} 条（约 ${st.max_tokens} token 以内）发给模型；
      更早的部分自动总结成这里的记忆，放进系统提示。同一台设备的所有 API 模型共用一份记忆，Claude Code 和 Grok Bot 不用它（它们的上下文在自己的会话里）。
      在这里修改或清空后，下一次提问就按新的来。</p></div>${status}</div>
    <div id="mem-list"></div>`;
  const list = $("mem-list");
  const draw = () => {
    if (!d.devices.length) { list.innerHTML = '<div class="card panel muted">还没有聊天记录。设备聊过几轮、旧对话被截掉后，这里会出现总结出来的记忆。</div>'; return; }
    list.innerHTML = d.devices.map((x) => {
      const m = x.memory, value = edits[x.device] ?? m.summary;
      const models = x.models.map((o) => `${esc(o.label)} ${o.count} 条${o.agent ? "（不总结）" : ""}`).join("、") || "没有聊天记录";
      return `<div class="card panel" data-device="${esc(x.device)}">
        <div class="device-top"><span class="dot ${x.online ? "on" : ""}"></span><b class="mono">${esc(x.device)}</b>
          ${m.updated ? `<span class="pill">${esc(SOURCE[m.source] || "")} · ${esc(fmt(m.updated))}</span>` : '<span class="pill">还没有记忆</span>'}</div>
        <p class="muted small" style="margin:8px 0 0">存着的记录：${models}</p>
        <label class="f" style="margin-top:14px">记忆全文<span class="hint">要点式，每条一行；自动总结时会在这份基础上合并新的内容（约 ${st.summary_chars} 字以内）</span>
          <textarea class="in" rows="8" data-edit maxlength="5000" placeholder="（空）">${esc(value)}</textarea></label>
        <div class="actions"><span class="result muted small">${value.length} 字</span>
          <button class="btn" data-clear ${m.summary || value ? "" : "disabled"}>清空</button>
          <button class="btn primary" data-save>保存</button></div></div>`;
    }).join("");
    list.querySelectorAll("[data-device]").forEach((card) => {
      const dev = card.dataset.device, x = d.devices.find((y) => y.device === dev);
      const ta = card.querySelector("[data-edit]");
      ta.oninput = () => { edits[dev] = ta.value; card.querySelector(".result").textContent = `${ta.value.length} 字`; };
      const save = (btn, text) => busy(btn, async () => {
        const res = await fetch("/admin/api/memory/save", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device: dev, summary: text, version: x.memory.version }) });
        const r = await res.json().catch(() => ({}));
        if (res.status === 401) return toast(EXPIRED + "。请先复制改好的内容，再刷新页面重新登录", true);
        if (res.status === 409) { x.memory = r.memory; toast(r.error, true); draw(); return; }
        if (!res.ok || r.ok === false) return toast(r.error || "保存失败", true);
        x.memory = r.memory; delete edits[dev];
        toast(text ? "已保存，下一次提问就用新的记忆" : "记忆已清空"); draw();
      });
      card.querySelector("[data-save]").onclick = (e) => save(e.currentTarget, ta.value);
      card.querySelector("[data-clear]").onclick = (e) => { if (confirm(`清空 ${dev} 的记忆？聊天记录不受影响。`)) save(e.currentTarget, ""); };
    });
  };
  draw();
}

async function renderCallNames(root) {
  const d = await api("call-names");
  let models = d.models.map((m) => ({ ...m, aliases: [...m.aliases] }));
  let learning = d.learning, devices = d.devices;
  const labelOf = (entry) => (d.targets.find((t) => t.entry === entry) || models.find((m) => m.entry === entry) || { label: entry }).label;
  setOnline(devices);
  root.innerHTML = `
    <div class="page-head"><div><h1>呼名</h1><p class="sub">唤醒设备后，句子开头说“嗨 + 称呼”，就换成对应的模型回答；之后直接说话也交给它，直到叫别的称呼。每个模型只记得跟自己的对话。
      只说称呼时只切换模型、回一声“${esc(d.reply)}”，不启动 Claude；说出第一句话时才启动，并判断要不要接上次的对话。完整经过见<a href="#how">工作原理</a>。</p></div>
      <span class="pill ${d.enabled ? "ok" : ""}">${d.enabled ? "已开启" : "已关闭"}</span></div>
    <div class="card panel">
      <label class="switch" style="margin-top:0"><input type="checkbox" id="cn-enabled" ${d.enabled ? "checked" : ""}><span>开启呼名</span>
        <small>关闭后，“嗨 + 称呼”会当作普通的话交给当前模型</small></label>
      <label class="f" style="margin-top:16px">只说称呼时的回复<span class="hint">只说“嗨 + 称呼”时，服务端切换模型后直接回这句，不启动模型。越短越快，中间的标点会去掉、一次播完</span>
        <input class="in" id="cn-reply" value="${esc(d.reply)}" maxlength="40"></label>
      <p class="muted small" style="margin:12px 0 0">语音识别常把称呼听成别的写法（比如 Claude 会听成 cloud），每种写法都要列出来。开头的“${esc(d.prefixes.join(" / "))}”不用写。设备第一次连上时用后台默认的模型（${esc(labelOf(d.default) || d.default || "未设置")}），之后记住每台设备上次叫的模型。</p>
    </div>
    <div id="cn-models"></div>
    <div class="card panel" id="cn-add-box" style="margin-top:16px"></div>
    <div class="actions"><span class="result muted">保存后马上生效，不用重启服务。</span><button class="btn primary" id="cn-save">保存</button></div>`;

  const allAliases = () => models.flatMap((m) => m.aliases);
  const findModel = (entry) => models.find((m) => m.entry === entry);
  const addAlias = (m, a) => {
    a = String(a || "").trim().toLowerCase();
    if (!a) return;
    const owner = models.find((x) => x.aliases.includes(a));
    if (owner && owner !== m) { toast(`“${a}”已经是 ${owner.label} 的称呼`, true); return; }
    if (!m.aliases.includes(a)) m.aliases.push(a);
  };

  const learnHtml = (m) => {
    const mine = learning.target === m.entry;
    const samples = mine ? learning.samples || [] : [];
    const say = esc(m.aliases[0] || m.label);
    let html = "";
    if (mine && learning.active) {
      html = `<div class="banner info" style="margin:12px 0">正在录入：先唤醒设备，再说“嗨 ${say}”，每说一遍等设备回答“收到”再说下一遍。
        已录 ${samples.length}/${learning.count} 遍，还剩 ${learning.seconds_left} 秒。</div>
        <button class="btn sm" data-stop>停止录入</button>`;
    } else if (learning.active) {
      html = '<p class="muted small" style="margin:12px 0 0">正在给别的模型录入，录完再来。</p>';
    } else if (!devices.length) {
      html = '<p class="muted small" style="margin:12px 0 0">用设备录入：没有设备在线。先唤醒设备，再刷新本页。</p>';
